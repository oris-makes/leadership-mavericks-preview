<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serif Accent Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&amp;family=Instrument+Serif:ital@0;1&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&amp;family=Playfair+Display:ital,wght@0,400;1,400&amp;family=DM+Serif+Display:ital@0;1&amp;family=Momo+Signature&amp;family=Momo+Trust+Display&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B181A; --paper:#FFFFF4; --muted:#D8D5C9; --quiet:#A9A497; --signal:#FC4E2B;
  /* swapped by the toolbar */
  --serif:'Instrument Serif'; --serif-size:1.1em; --serif-track:-0.01em; --serif-color:inherit; --serif-style:italic; --serif-weight:400;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;overflow-x:hidden}

.hero{display:flex;flex-wrap:wrap;min-height:100svh}
.hero-l{flex:1 1 560px;min-width:0;background:var(--ink);color:var(--paper);padding:40px clamp(24px,6vw,96px) clamp(120px,9vw,140px);display:flex;flex-direction:column;gap:96px;min-height:760px}
.hero-l .logo img{height:48px;width:auto;display:block}
.copy{display:flex;flex-direction:column;gap:28px;max-width:560px;margin-top:auto}
.eyebrow{margin:0;display:flex;align-items:center;gap:14px;font-size:13px;line-height:20px;font-weight:600;letter-spacing:.08em;color:var(--quiet)}
.eyebrow span{width:32px;height:1px;background:var(--quiet)}
h1{margin:0;font-size:clamp(44px,4.6vw,66px);line-height:1.04;font-weight:450;letter-spacing:-0.035em;text-wrap:balance}
.lead{margin:0;font-size:19px;line-height:30px;color:var(--muted);max-width:480px;text-wrap:pretty}
.cta{margin-top:8px;align-self:flex-start;display:inline-flex;align-items:center;gap:36px;min-height:52px;padding:0 22px 0 26px;border-radius:999px;background:var(--paper);color:var(--signal);text-decoration:none;font-size:15px;font-weight:600}

.lm-serif{font-family:var(--serif),Georgia,serif;font-style:var(--serif-style);font-weight:var(--serif-weight);font-size:var(--serif-size);letter-spacing:var(--serif-track);color:var(--serif-color);line-height:0}
.lm-serif.off{font-family:inherit;font-style:normal;font-weight:inherit;font-size:1em;letter-spacing:inherit;color:inherit}

.hero-r{position:relative;flex:1 1 560px;min-width:0;padding:28px clamp(24px,6vw,96px) 56px;display:flex;flex-direction:column;gap:24px;background:var(--paper)}
.hero-r nav{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px}
.hero-r nav a{padding:12px 14px;font-size:15px;font-weight:500;text-decoration:none;color:var(--ink)}
.hero-r nav a:last-child{margin-left:10px;color:var(--signal)}
.art{flex:1;display:flex;align-items:center;justify-content:center}
.art img{width:100%;max-width:560px;height:auto;display:block}

/* Toolbar */
.bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:10;width:max-content;max-width:calc(100vw - 32px);display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:20px;background:rgba(255,255,244,.96);color:var(--ink);box-shadow:0 0 0 1px rgba(27,24,26,.12),0 12px 32px rgba(27,24,26,.22)}
.row{display:flex;flex-wrap:wrap;gap:6px;max-width:min(980px,calc(100vw - 56px))}
.row::-webkit-scrollbar{display:none}
.bar button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(27,24,26,.18);background:transparent;color:var(--ink);font:500 14px/1 'Inter',sans-serif;cursor:pointer;white-space:nowrap;transition:background-color 150ms ease,color 150ms ease,border-color 150ms ease}
.bar button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bar button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
@media (hover:hover) and (pointer:fine){.bar button:not([aria-pressed="true"]):hover{border-color:var(--ink)}}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 4px;font-size:13px;line-height:18px;color:#5E5953}
.meta strong{color:var(--ink);font-weight:600}
.sw{display:flex;gap:6px;flex:none}
.sw button{min-height:32px;padding:0 12px;font-size:13px}

@media (max-width:640px){
  .hero-l{min-height:0;padding:24px 20px 56px;gap:56px}
  .hero-r{padding:32px 20px 220px}
  .hero-r nav{display:none}
  h1{font-size:42px;line-height:1.05}
  .lead{font-size:17px;line-height:27px}
  .cta{width:100%;justify-content:space-between}
  .bar{bottom:12px;width:calc(100vw - 32px)}
  .meta{flex-direction:column;align-items:flex-start}
  .row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:none}
  .sw{flex-wrap:wrap}
}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-l">
    <a class="logo" href="./home.html" aria-label="Leadership Mavericks home"><img src="./assets/logo.png" alt="Leadership Mavericks"></a>
    <div class="copy">
      <p class="eyebrow"><span></span>PARTNER-LED EXECUTIVE SEARCH</p>
      <h1>The Leadership Roles Others Find Hard to Fill. <em class="lm-serif" id="accent">We Fill Them.</em></h1>
      <p class="lead">Niche skill sets, diversity mandates and discreet replacements. At Leadership Mavericks, a partner runs your search from first brief to signed offer.</p>
      <a class="cta" href="./home.html#contact">Talk to a Partner
        <svg width="36" height="12" viewBox="0 0 40 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M0 6h38M33 1l5 5-5 5"/></svg>
      </a>
    </div>
  </div>
  <div class="hero-r">
    <nav aria-label="Primary"><a href="#">Home</a><a href="#">About Us</a><a href="#">Services</a><a href="#">Articles</a><a href="#">Contact Us</a></nav>
    <div class="art"><img src="./assets/hero-v3.png" alt="" width="812" height="812"></div>
  </div>
</header>

<div class="bar" role="group" aria-label="Serif accent test controls">
  <div class="row" id="fonts" role="toolbar" aria-label="Serif font"></div>
  <div class="meta">
    <span id="note" aria-live="polite"></span>
    <div class="sw" role="group" aria-label="Accent style and colour">
      <button type="button" data-style="italic" aria-pressed="true">Italic</button>
      <button type="button" data-style="normal" aria-pressed="false">Upright</button>
      <span style="width:1px;background:rgba(27,24,26,.18);margin:4px 2px"></span>
      <button type="button" data-color="inherit" aria-pressed="true">Heading colour</button>
      <button type="button" data-color="var(--signal)" aria-pressed="false">Signal orange</button>
    </div>
  </div>
</div>

<script>
// size/tracking compensate for each face's x-height so the accent sits level with Inter
const FONTS = [
  { id:'instrument', name:'Instrument Serif', family:"'Instrument Serif'", size:'1.1em',  track:'-0.01em', note:'Condensed, editorial, current' },
  { id:'newsreader', name:'Newsreader',       family:"'Newsreader'",       size:'1.02em', track:'-0.02em', note:'Calm, newspaper-like, credible' },
  { id:'source',     name:'Source Serif 4',   family:"'Source Serif 4'",   size:'1em',    track:'-0.02em', note:'Plain, balanced, bookish' },
  { id:'playfair',   name:'Playfair Display', family:"'Playfair Display'", size:'0.98em', track:'-0.02em', note:'High contrast, fashion-magazine' },
  { id:'dmserif',    name:'DM Serif Display', family:"'DM Serif Display'", size:'1em',    track:'-0.02em', note:'Bold, heavy, loudest' },
  { id:'momosig',    name:'Momo Signature',   family:"'Momo Signature'",   size:'0.84em',    track:'0', upright:true, note:'Signature script, personal, expressive' },
  { id:'momotrust',  name:'Momo Trust Display', family:"'Momo Trust Display'", size:'1em', track:'-0.02em', upright:true, note:'Display face, single style' },
  { id:'none',       name:'No serif',         family:null,                 size:'1em',    track:'0',      note:'Inter only — the baseline' }
];
const root = document.documentElement, accent = document.getElementById('accent');
const wrap = document.getElementById('fonts'), note = document.getElementById('note');

function apply(id, push){
  const f = FONTS.find(x => x.id === id) || FONTS[0];
  accent.classList.toggle('off', !f.family);
  if (f.family){ root.style.setProperty('--serif', f.family); root.style.setProperty('--serif-size', f.size); root.style.setProperty('--serif-track', f.track); root.style.setProperty('--serif-weight', f.weight || 400); }
  accent.style.fontStyle = f.upright ? 'normal' : '';
  wrap.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === f.id));
  note.innerHTML = '<strong>' + f.name + '</strong> · ' + f.note;
  if (push){ const u = new URL(location.href); u.searchParams.set('serif', f.id); history.replaceState(null, '', u); }
}

FONTS.forEach(f => {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.id = f.id; b.textContent = f.name;
  if (f.family) b.style.cssText = 'font-family:' + f.family + ',Georgia,serif;font-style:' + (f.upright ? 'normal' : 'var(--serif-style)') + ';font-weight:' + (f.weight || 400) + ';font-size:' + (f.upright ? '14px' : '16px');
  b.addEventListener('click', () => apply(f.id, true));
  wrap.appendChild(b);
});

// ←/→ cycle fonts from anywhere on the page
document.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const cur = wrap.querySelector('[aria-pressed="true"]').dataset.id;
  const i = FONTS.findIndex(x => x.id === cur), n = FONTS.length;
  const next = FONTS[(i + (e.key === 'ArrowRight' ? 1 : n - 1)) % n];
  apply(next.id, true);
  wrap.querySelector('[data-id="' + next.id + '"]').scrollIntoView({ block:'nearest', inline:'nearest' });
});

document.querySelectorAll('[data-color]').forEach(b => b.addEventListener('click', () => {
  root.style.setProperty('--serif-color', b.dataset.color);
  document.querySelectorAll('[data-color]').forEach(x => x.setAttribute('aria-pressed', x === b));
}));

document.querySelectorAll('[data-style]').forEach(b => b.addEventListener('click', () => {
  root.style.setProperty('--serif-style', b.dataset.style);
  document.querySelectorAll('[data-style]').forEach(x => x.setAttribute('aria-pressed', x === b));
}));

apply(new URLSearchParams(location.search).get('serif') || 'instrument', false);
</script>
</body>
</html>
